# CI — runs on every PR and on push to main.
#
# No secrets required. Everything here runs against ephemeral, locally-created
# resources (a service-container Postgres, npm cache). Safe to run with zero
# repo configuration.
#
# backend job mirrors backend/test/support/global-setup.ts: it needs a
# *superuser* Postgres reachable at E2E_SUPERUSER_URL so the e2e suite can
# create a throwaway DB + a restricted `coifyn_app`-granted role per run (for
# RLS to actually be exercised). The `postgres:16` service container's default
# `postgres` superuser satisfies that.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Superuser URL global-setup.ts uses to create/drop the per-run test DB
      # and app role. The e2e suite overwrites DATABASE_URL itself once that
      # setup runs — these are just the entry point.
      E2E_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: E2E tests (against service-container Postgres)
        run: npm run test:e2e

      - name: Build
        run: npm run build

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, build (turbo)
        run: npx turbo run lint check-types build

      # Playwright e2e per architecture.md / PROJECT-CONVENTIONS.txt §12 ("Test:
      # ... Playwright (frontend)"). This references the `test:e2e` script the
      # frontend is expected to add per the approved plan. Until that script
      # and a Playwright config land, this step fails loudly (by design — a
      # missing script is a real CI failure, not something to paper over with
      # continue-on-error) rather than being silently skipped.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e
        run: npm run test:e2e
